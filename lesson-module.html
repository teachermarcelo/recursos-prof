<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson Module Studio | FLUENT IMMERSION</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><style>
:root{--bg:#090b20;--side:#10152e;--panel:#fff;--text:#f8f8ff;--muted:#b8bfd9;--line:#30365c;--purple:#7c3aed;--orange:#ff9b24;--ink:#202344}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#2a205d,transparent 35%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1280px,95%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:15px 0;border-bottom:1px solid #ffffff20}.btn{display:inline-flex;padding:10px 14px;border-radius:999px;background:linear-gradient(100deg,#ff8b1b,#ffb13b);color:#171329;font-weight:900;border:0;cursor:pointer}.btn.alt{background:#ffffff0b;border:1px solid #ffffff25;color:inherit}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;padding:22px 0 50px}.side{align-self:start;position:sticky;top:12px;border:1px solid var(--line);background:var(--side);border-radius:15px;padding:10px}.side h3{margin:8px 10px;color:#aeb7d8;font-size:11px;letter-spacing:.12em}.side a{display:block;padding:9px 10px;border-radius:9px;font-size:13px;color:#dce0f5;margin:2px 0}.side a.active,.side a:hover{background:#7c3aed44;color:white}.content{background:var(--panel);color:var(--ink);border-radius:20px;padding:clamp(20px,4vw,40px);min-height:500px}.eyebrow{display:inline-block;padding:4px 9px;background:#eee7ff;color:#4c288b;border-radius:99px;font-size:11px;font-weight:900}.content h1{font-size:clamp(30px,4vw,46px);line-height:1.08;margin:12px 0}.muted{color:#69708b}.lead{font-size:17px;color:#454b68}.module-block{border:1px solid #e0e3f0;background:#fafaff;border-radius:12px;padding:16px;margin:12px 0}.module-block h3{margin:0 0 8px;color:#3c267a}.module-block p{margin:6px 0;white-space:pre-wrap}.module-block ul{margin:8px 0}.status{padding:14px;border-radius:10px;background:#f1efff;color:#3c267a}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static}.side nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){html,body{overflow-x:hidden}.wrap{width:calc(100% - 24px)}.top{align-items:flex-start;flex-direction:column;gap:10px;padding:12px 0}.top .actions{width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:8px}.top .btn{min-width:0;text-align:center;white-space:normal;padding:10px 7px;font-size:12px}.layout{grid-template-columns:minmax(0,1fr);gap:12px;padding:14px 0 30px}.side{position:static;min-width:0;padding:8px}.side nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.side a{min-width:0;font-size:11px;line-height:1.3;overflow-wrap:anywhere}.content{padding:18px 14px;min-width:0}.content h1{font-size:clamp(28px,8vw,38px);overflow-wrap:anywhere}.module-block{padding:12px;min-width:0;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr}.actions .btn{justify-content:center;white-space:normal;text-align:center}}</style></head><body><div class="wrap"><header class="top"><a href="index.html"><b>🟠 FLUENT IMMERSION · LESSON MODULES</b></a><div class="actions" style="margin:0"><a class="btn alt" id="back" href="levels.html">Back to level</a><a class="btn" href="admin.html">Admin Studio</a></div></header><div class="layout"><aside class="side"><h3>LESSON KIT MODULES</h3><nav id="nav"></nav></aside><main class="content"><span class="eyebrow" id="meta">LESSON MODULE</span><h1 id="title">Loading lesson…</h1><p class="lead" id="description">Each module opens at its own URL so it can be linked, reviewed and developed separately.</p><div id="body" class="status">Loading lesson content…</div><div class="actions" id="pager"></div></main></div></div><script>
const cfg=window.FI_CONFIG||{},params=new URLSearchParams(location.search),slug=params.get('lesson')||'A2-UNIT01-LESSON001',current=params.get('module')||'overview';const $=id=>document.getElementById(id);
const modules=[['overview','Lesson Overview','overview'],['warmup','Warm-up & Engagement','warmup'],['vocabulary','Vocabulary Lab','vocabulary'],['student_book','Student Book / Input','student_book'],['grammar','Grammar Lab','grammar'],['reading','Reading Lab','reading'],['listening','Listening Lab','listening'],['speaking','Speaking Lab','speaking'],['writing','Writing Lab','writing'],['interactive_activities','Interactive Activities & Gamification','interactive_activities'],['assessment','Assessment Pack','assessment'],['flashcards','Flashcards & Spaced Repetition','flashcards'],['homework','Homework & Real-life Challenge','homework'],['teacher_guide','Teacher Guide','teacher_guide'],['differentiation','Differentiation & Accessibility','differentiation'],['answer_key','Answer Key & Explanations','answer_key'],['progress_report','Student Progress & Report','progress_report'],['materials','Materials & Export','materials']];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderValue(v){if(v===null||v===undefined||v==='')return '<p class="muted">This module has not been authored for this lesson yet.</p>';if(typeof v==='string'||typeof v==='number'||typeof v==='boolean')return '<p>'+esc(v)+'</p>';if(Array.isArray(v))return '<ul>'+v.map(item=>'<li>'+renderValue(item)+'</li>').join('')+'</ul>';return Object.entries(v).map(([k,val])=>'<section class="module-block"><h3>'+esc(k.replace(/_/g,' '))+'</h3>'+renderValue(val)+'</section>').join('')}
(async()=>{if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey){$('body').textContent='Supabase configuration is unavailable.';return}try{const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data,error}=await sb.schema('fluent_immersion').from('lessons').select('slug,title,subtitle,cefr_level,topic,description,lesson_content,is_free,status').eq('slug',slug).eq('status','published').maybeSingle();if(error)throw error;if(!data){$('title').textContent='Lesson unavailable';$('body').innerHTML='<p>This lesson is not available to the current account. Free samples are open; restricted kits require authorized access.</p>';return}const mod=modules.find(m=>m[0]===current)||modules[0];$('title').textContent=data.title+' — '+mod[1];$('meta').textContent=data.cefr_level+' · '+(data.topic||'English lesson');$('description').textContent=data.description||'Lesson content organized as an independent module.';$('back').href='level-dashboard.html?level='+encodeURIComponent(data.cefr_level);$('nav').innerHTML=modules.map(m=>'<a class="'+(m[0]===mod[0]?'active':'')+'" href="lesson-module.html?lesson='+encodeURIComponent(slug)+'&module='+encodeURIComponent(m[0])+'">'+esc(m[1])+'</a>').join('');const content=data.lesson_content||{};let value=content[mod[2]];if(mod[0]==='overview'&&!value)value=content.overview||{topic:data.topic,description:data.description,objectives:data.learning_objectives};if(mod[0]==='differentiation'&&!value)value=content.teacher_guide?.differentiation||null;if(mod[0]==='progress_report'&&!value)value={purpose:'Record only observed student performance; do not invent scores.',fields:['Objectives achieved','Vocabulary demonstrated','Communication performance','Difficulties observed','Recommended next steps']};if(mod[0]==='materials'&&!value)value={available_content:'Review the modules in this lesson.',resource_status:'Check each asset before describing it as a downloadable file.'};$('body').innerHTML=renderValue(value);const idx=modules.findIndex(m=>m[0]===mod[0]);const prev=modules[idx-1],next=modules[idx+1];$('pager').innerHTML=(prev?'<a class="btn alt" href="lesson-module.html?lesson='+encodeURIComponent(slug)+'&module='+prev[0]+'">← '+esc(prev[1])+'</a>':'')+(next?'<a class="btn" href="lesson-module.html?lesson='+encodeURIComponent(slug)+'&module='+next[0]+'">Next: '+esc(next[1])+' →</a>':'');}catch(e){$('title').textContent='Could not load lesson';$('body').textContent=e.message;console.error(e)}})();
</script></body></html>
