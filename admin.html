<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b20"><title>Admin Studio | FLUENT IMMERSION"><style>
:root{--bg:#090b1b;--side:#0e1228;--panel:#151a35;--line:#30365b;--text:#f8f8ff;--muted:#adb8d8;--orange:#ff9b25;--purple:#9575ff;--green:#61d6a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--side);border-right:1px solid #ffffff12;padding:22px 15px}.brand{display:flex;align-items:center;gap:10px;font-weight:950;margin-bottom:32px}.mark{background:linear-gradient(135deg,#ff8a1b,#ffc24d);color:#171329;border-radius:11px;padding:9px 11px}.nav a{display:block;padding:11px 12px;border-radius:10px;color:#cbd1eb;margin:4px 0;font-size:13px;font-weight:750}.nav a:hover,.nav .active{background:#7c3aed3b;color:white}.navlabel{font-size:10px;letter-spacing:.14em;color:#7380aa;font-weight:900;margin:20px 10px 8px}.main{min-width:0}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#090b1bed;backdrop-filter:blur(12px);z-index:5}.content{padding:30px;max-width:1600px;margin:auto}.muted{color:var(--muted)}.hero{border:1px solid #a78bfa44;border-radius:20px;padding:26px;background:radial-gradient(ellipse at 90% 0%,#4b2f8a80,transparent 55%),linear-gradient(130deg,#191d3e,#11152d);margin-bottom:22px}.hero h1{font-size:clamp(30px,4vw,45px);line-height:1.1;margin:10px 0}.tag{font-size:10px;letter-spacing:.14em;color:#ded4ff;font-weight:950}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.panel{border:1px solid #ffffff15;background:linear-gradient(145deg,#161b38,#11152c);border-radius:16px;padding:20px}.panel h2{margin:4px 0 15px;font-size:20px}.panel label{display:block;color:#c4cbed;font-size:12px;font-weight:800;margin:11px 0 5px}.panel input,.panel textarea,.panel select{width:100%;padding:11px 12px;border:1px solid #343b65;border-radius:10px;background:#0c1025;color:white;font:inherit}.panel textarea{min-height:90px;resize:vertical}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border:0;border-radius:10px;background:linear-gradient(110deg,#ff8b1b,#ffb33e);color:#171329;font-weight:900;cursor:pointer}.btn.ghost{background:#ffffff08;border:1px solid #ffffff22;color:white}.btn.purple{background:#7c3aed;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.msg{padding:12px;border:1px solid #ffffff18;border-radius:10px;color:var(--muted);font-size:12px;margin:15px 0}.tablewrap{overflow:auto;border:1px solid #ffffff16;border-radius:13px;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ffffff12;font-size:12px}th{color:#9eabd1;font-size:10px;letter-spacing:.1em}td{color:#e4e7f8}.status{display:inline-block;border-radius:99px;padding:4px 8px;font-size:10px;background:#253e3b;color:#8de3c0}.empty{padding:24px;text-align:center;color:var(--muted)}.hide{display:none!important}@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 15px}.content{padding:16px}.grid{grid-template-columns:1fr}.top .hide-mobile{display:none}}
body.light{--bg:#f4f5fb;--side:#fff;--panel:#fff;--line:#d9dced;--text:#171832;--muted:#5d6480;background:#f4f5fb;color:var(--text)}body.light .top{background:#fffffff0;border-color:#d9dced}body.light .hero,body.light .panel{background:#fff;color:#171832;border-color:#d9dced}body.light .panel input,body.light .panel textarea,body.light .panel select{background:#fff;color:#171832;border-color:#cbd0e2}body.light th,body.light td{color:#353852}body.light .nav a{color:#353852}body.light .nav a:hover,body.light .nav .active{color:#171832}body.light .btn.ghost{color:#171832;border-color:#cbd0e2;background:#fff}@media(max-width:640px){html,body{overflow-x:hidden}.app{grid-template-columns:minmax(0,1fr);width:100%}.app>.side{display:block;position:static;width:100%;min-width:0;padding:10px;overflow:hidden;border-right:0;border-bottom:1px solid var(--line)}.app>.side>.brand{display:block;margin:0 0 8px}.app>.side .nav{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;padding-bottom:7px}.app>.side .navlabel{display:none}.app>.side .nav a{flex:0 0 auto;padding:8px 10px;font-size:12px}.main{min-width:0;width:100%}.top{padding:10px;gap:8px;flex-wrap:wrap}.top .actions{display:grid!important;grid-template-columns:1fr 1fr;gap:7px;width:100%}.top .btn{min-width:0;white-space:normal;padding:9px 7px;font-size:12px}.content{padding:12px;min-width:0}.hero{padding:16px}.hero h1{font-size:clamp(26px,8vw,34px)}.grid{grid-template-columns:minmax(0,1fr);gap:10px}.panel{padding:13px;min-width:0}.panel input,.panel textarea,.panel select{width:100%;min-width:0}.tablewrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.tablewrap table{min-width:680px}.actions{flex-wrap:wrap}.actions .btn{white-space:normal;max-width:100%}.msg,.status,.empty{overflow-wrap:anywhere}}</style></head><body><div class="app"><aside class="side"><a class="brand" href="index.html"><span class="mark">FI</span><span>FLUENT IMMERSION<br><small style="color:#9da9ce;font-size:9px;letter-spacing:.14em">ADMIN STUDIO</small></span></a><nav class="nav"><div class="navlabel">ADMIN</div><a class="active" href="admin.html">⚙ Overview</a><a href="#create">＋ Create lesson</a><a href="#library">▤ Master lesson library</a><a href="html-studio.html">✎ HTML Content Studio</a><div class="navlabel">PLATFORM</div><a href="dashboard.html">▦ Teacher Command Center</a><a href="levels.html">◈ All Levels A0–C2</a><a href="ready-to-teach.html">✦ Ready-to-Teach</a><a href="free-lesson.html">🎮 Free lesson</a></nav></aside><main class="main"><header class="top"><div><b>Admin Studio</b><div class="muted" style="font-size:11px">Master content · publishing · curriculum</div></div><div class="actions" style="margin:0"><button class="btn ghost" id="theme-toggle" type="button">☾ / ☀</button><a class="btn ghost" href="html-studio.html">HTML Studio ↗</a><a class="btn ghost" href="dashboard.html">← Dashboard</a><button class="btn" id="logout">Sign out</button></div></header><div class="content"><section class="hero"><span class="tag">ADMIN ONLY · MASTER CONTENT</span><h1>Build the lesson library.</h1><p class="muted">Cadastre e publique aulas mestres para a biblioteca. Professores trabalham em cópias individuais; suas alterações não substituem o material original.</p><div class="actions"><a class="btn" href="#create">＋ Create lesson</a><a class="btn ghost" href="lesson.html?lesson=A2-UNIT01-LESSON001">Preview Lesson Studio ↗</a></div></section>
<div class="grid"><section class="panel" id="create" style="grid-column:span 2"><span class="tag">MASTER CONTENT CREATOR</span><h2>Create a lesson</h2><form id="create-form"><label for="slug">Lesson ID / slug</label><input id="slug" required value="A2-UNIT01-LESSON002" pattern="[A-Za-z0-9-]+" placeholder="A2-UNIT01-LESSON002"><div style="display:grid;grid-template-columns:2fr 1fr;gap:12px"><div><label for="title">Lesson title</label><input id="title" required placeholder="e.g. At the Hotel"></div><div><label for="level">CEFR level</label><select id="level"><option>A0</option><option>A1</option><option selected>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></div></div><label for="topic">Topic / unit</label><input id="topic" placeholder="Travel, Unit 01"><label for="description">Description</label><textarea id="description" placeholder="Communicative goal and short description"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label for="duration">Duration (minutes)</label><input id="duration" type="number" min="10" max="180" value="45"></div><div><label for="status">Publication status</label><select id="status"><option value="draft">Draft — private</option><option value="published">Published</option></select></div><div><label for="is-free">Access</label><select id="is-free"><option value="false">Paid / restricted</option><option value="true">Free / public</option></select></div></div><label for="objectives">Learning objectives (one per line)</label><textarea id="objectives" placeholder="Learners will be able to…"></textarea><label for="lesson-json">Lesson content JSON (optional advanced editor)</label><textarea id="lesson-json" rows="9" placeholder='{"communicative_objective":"Learners will be able to…","vocabulary":[],"dialogue":[],"reading":{"title":"","text":"","questions":[]},"speaking":{"tasks":[]},"listening":{"script":"","questions":[]},"grammar":{"focus":"","rule":"","examples":[],"practice":[]},"assessment":{"quiz":[]},"teacher_guide":{"flow":[]},"homework":"","differentiation":{"support":"","extension":""}}'></textarea><p class="muted" style="font-size:11px">If left empty, the lesson is saved as a draft shell. Paste valid JSON to populate the skill-specific sections.</p><div class="actions"><button class="btn" type="submit">Save master lesson</button><button class="btn ghost" type="reset">Clear form</button></div></form><div id="create-msg" class="msg">Master content is stored separately from teacher copies. If the database rejects the operation, review the schema/API settings and RLS policy.</div></section>
<section class="panel"><span class="tag">CONTENT PRINCIPLES</span><h2>18-component standard</h2><p class="muted">Every published lesson should be reviewed against the FLUENT IMMERSION standard.</p><div class="msg">01–06 · Overview, Teacher’s Guide, Student Book, Worksheets, Slides, Answer Key.</div><div class="msg">07–13 · Vocabulary, Speaking, Listening/Reading when applicable, Grammar, Assessment, Homework.</div><div class="msg">14–18 · Differentiation, Progress Tracker, Start Here, License, QA Report.</div><div class="msg">Do not publish a lesson as complete if files or audio are not actually present and tested.</div></section></div>
<section class="panel" id="library" style="margin-top:18px"><span class="tag">MASTER LESSON LIBRARY</span><h2>Lessons in Supabase</h2><p class="muted">Apenas a conta administradora pode criar, editar ou publicar conteúdo mestre.</p><div class="actions"><button class="btn purple" id="refresh">↻ Refresh library</button></div><div class="tablewrap"><table><thead><tr><th>LESSON ID</th><th>TITLE</th><th>LEVEL</th><th>STATUS</th><th>DURATION</th><th>ACTIONS</th></tr></thead><tbody id="lessons-body"><tr><td colspan="6" class="empty">Checking admin session…</td></tr></tbody></table></div></section>
<div class="msg" id="auth-msg" role="status">Checking account…</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script>
const cfg=window.FI_CONFIG||{},adminEmail='marcellospropaganda@gmail.com';if(localStorage.getItem('fi-theme')==='light')document.body.classList.add('light');document.getElementById('theme-toggle').addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem('fi-theme',document.body.classList.contains('light')?'light':'dark')});let sb=null,authed=false,currentEditingSlug=null,libraryRows=[];if(window.supabase&&cfg.supabaseUrl&&cfg.supabaseAnonKey)sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const authMsg=document.getElementById('auth-msg'),body=document.getElementById('lessons-body');
function message(t){authMsg.textContent=t}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function check(){if(!sb){message('Supabase not configured.');location.href='login.html';return}const {data,error}=await sb.auth.getUser();if(error||!data.user){message('Please sign in first.');location.href='login.html';return}if((data.user.email||'').toLowerCase()!==adminEmail){message('This account does not have admin access.');document.getElementById('create-form').classList.add('hide');body.innerHTML='<tr><td colspan="6" class="empty">Admin permission required.</td></tr>';return}authed=true;message('Admin authenticated: '+data.user.email+'. Master content is separate from teacher edits.');await load()}
async function load(){if(!authed||!sb)return;body.innerHTML='<tr><td colspan="6" class="empty">Loading…</td></tr>';const {data,error}=await sb.schema('fluent_immersion').from('lessons').select('id,slug,title,subtitle,cefr_level,topic,description,status,is_free,duration_minutes,learning_objectives,lesson_content').order('created_at',{ascending:false});if(error){body.innerHTML='<tr><td colspan="6" class="empty">Could not load library: '+esc(error.message)+'</td></tr>';return}if(!data?.length){body.innerHTML='<tr><td colspan="6" class="empty">No master lessons yet. Create the first one above.</td></tr>';return}libraryRows=data;body.innerHTML=data.map(x=>'<tr><td>'+esc(x.slug)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.cefr_level)+'</td><td><span class="status">'+esc(x.status)+'</span></td><td>'+esc(x.duration_minutes)+' min</td><td><button class="btn ghost edit-lesson" data-slug="'+esc(x.slug)+'">Edit</button> <a class="btn ghost" href="lesson.html?lesson='+encodeURIComponent(x.slug)+'">Preview ↗</a></td></tr>').join('');body.querySelectorAll('.edit-lesson').forEach(b=>b.addEventListener('click',()=>editLesson(b.dataset.slug)))}
function editLesson(slug){const x=libraryRows.find(r=>r.slug===slug);if(!x)return;currentEditingSlug=x.slug;document.getElementById('slug').value=x.slug;document.getElementById('slug').disabled=true;document.getElementById('title').value=x.title||'';document.getElementById('level').value=x.cefr_level||'A1';document.getElementById('topic').value=x.topic||x.subtitle||'';document.getElementById('description').value=x.description||'';document.getElementById('duration').value=x.duration_minutes||45;document.getElementById('status').value=x.status||'draft';document.getElementById('is-free').value=String(!!x.is_free);document.getElementById('objectives').value=(x.learning_objectives||[]).join('\\n');document.getElementById('lesson-json').value=JSON.stringify(x.lesson_content||{},null,2);document.querySelector('#create-form button[type="submit"]').textContent='Update master lesson';document.getElementById('create-msg').textContent='Editing '+slug+'. Changes update the master lesson; teacher copies remain separate.';location.hash='#create';document.getElementById('title').focus()}
document.getElementById('create-form').addEventListener('reset',()=>{setTimeout(()=>{currentEditingSlug=null;document.getElementById('slug').disabled=false;document.querySelector('#create-form button[type="submit"]').textContent='Save master lesson';document.getElementById('create-msg').textContent='Master content is stored separately from teacher copies.'},0)});
document.getElementById('create-form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('create-msg');if(!authed||!sb){out.textContent='Admin session not ready.';return}const slug=document.getElementById('slug').value.trim(),title=document.getElementById('title').value.trim();const objectives=document.getElementById('objectives').value.split('\\n').map(x=>x.trim()).filter(Boolean);let lessonContent={components_status:'draft',admin_created:true,communicative_objective:document.getElementById('description').value.trim(),success_criteria:objectives,vocabulary:[],dialogue:[],reading:{title:'',text:'',questions:[]},speaking:{tasks:[]},listening:{script:'',questions:[]},grammar:{focus:'',rule:'',examples:[],practice:[]},assessment:{quiz:[]},teacher_guide:{flow:[]},homework:'',differentiation:{support:'',extension:''}};const raw=document.getElementById('lesson-json').value.trim();if(raw){try{lessonContent=JSON.parse(raw)}catch(parseError){out.textContent='Invalid lesson JSON: '+parseError.message;return}}const record={slug,title,subtitle:document.getElementById('topic').value.trim(),cefr_level:document.getElementById('level').value,topic:document.getElementById('topic').value.trim(),description:document.getElementById('description').value.trim(),duration_minutes:Number(document.getElementById('duration').value)||45,is_free:document.getElementById('is-free').value==='true',status:document.getElementById('status').value,learning_objectives:objectives,lesson_content:lessonContent};out.textContent='Saving…';const request=currentEditingSlug?sb.schema('fluent_immersion').from('lessons').update(record).eq('slug',currentEditingSlug):sb.schema('fluent_immersion').from('lessons').insert(record);const {error}=await request;if(error){out.textContent='Could not save: '+error.message+' — verify that fluent_immersion is exposed in Supabase Data API and that RLS policies are applied.';return}out.textContent=(currentEditingSlug?'Master lesson updated.':'Master lesson saved.')+' Teacher copies remain separate.';e.target.reset();await load()});
document.getElementById('refresh').addEventListener('click',load);document.getElementById('logout').addEventListener('click',async()=>{if(sb)await sb.auth.signOut();location.href='login.html'});check();
</script></body></html>
