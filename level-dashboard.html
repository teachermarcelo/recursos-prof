<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b22"><title>Level Dashboard | FLUENT IMMERSION</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><style>
:root{--bg:#090b20;--panel:#151a38;--line:#30365c;--text:#f8f8ff;--muted:#b8bfd9;--orange:#ff9b24;--purple:#8b5cf6;--paper:#fff;--ink:#191b36}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#2b205e,transparent 35%),var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}body.light{--bg:#f4f5fb;--panel:#fff;--line:#d9dced;--text:#171832;--muted:#5d6480;background:#f4f5fb}a{color:inherit;text-decoration:none}.wrap{width:min(1240px,94%);margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #ffffff20;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:999px;background:linear-gradient(100deg,#ff8b1b,#ffb13b);color:#171329;font-weight:900;border:0;cursor:pointer}.btn.alt{background:#ffffff0b;border:1px solid #a99aff55;color:inherit}.hero{padding:32px 0 20px}.eyebrow,.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#7c3aed35;color:#e4dcff;font-size:11px;font-weight:900}.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.04;margin:12px 0}.grad{background:linear-gradient(90deg,#fff,#c7b8ff,#ff9b24);background-clip:text;color:transparent}body.light .grad{background:linear-gradient(90deg,#211b53,#7544bc,#a54b00);background-clip:text;color:transparent}.muted{color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{border:1px solid #ffffff20;background:var(--panel);padding:12px 16px;border-radius:12px;min-width:130px}.stat strong{display:block;font-size:22px;color:#ffb13b}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin:20px 0}.filters input,.filters select{min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px}.switch{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:50px}.results.list{display:flex;flex-direction:column}.lesson{border:1px solid #ffffff20;border-radius:15px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:180px}.results.list .lesson{min-height:0;flex-direction:row;align-items:center;justify-content:space-between;gap:16px}.lesson h2{font-size:17px;line-height:1.3;margin:6px 0}.lesson p{margin:0;color:var(--muted);font-size:13px}.lesson .bottom{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.results.list .bottom{margin-top:0;padding-top:0}.empty{border:1px dashed var(--line);padding:24px;border-radius:12px;color:var(--muted);grid-column:1/-1}@media(max-width:900px){.results{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}@media(max-width:560px){.results{grid-template-columns:1fr}.results.list .lesson{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}}
@media(max-width:640px){html,body{overflow-x:hidden}.wrap{width:calc(100% - 24px)}.nav{align-items:flex-start;gap:8px;padding:12px 0}.nav>div{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.nav .btn{min-width:0;padding:9px 6px;font-size:12px;white-space:normal;text-align:center}.hero{padding:24px 0 14px}.hero h1{font-size:clamp(30px,9vw,40px);overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{min-width:0;padding:10px}.filters{grid-template-columns:minmax(0,1fr);gap:8px}.filters input,.filters select{width:100%;min-width:0}.filters input{grid-column:auto}.switch{display:grid;grid-template-columns:1fr 1fr}.results{grid-template-columns:minmax(0,1fr);gap:10px}.lesson{min-width:0;padding:14px}.lesson h2{overflow-wrap:anywhere}.lesson .bottom{align-items:flex-start}.lesson .btn{white-space:normal;text-align:center}.results.list .lesson{flex-direction:column;align-items:stretch}.results.list .bottom{margin-top:10px}.empty{min-width:0}}</style></head><body><div class="wrap"><header class="nav"><a href="index.html"><b>🟠 FLUENT IMMERSION</b></a><div class="switch"><a class="btn alt" href="levels.html">All Levels</a><a class="btn alt" href="tracks.html">Specialist Tracks</a><button class="btn alt" id="theme">☀/☾ Theme</button><a class="btn" href="dashboard.html">My Dashboard</a></div></header><section class="hero"><span class="eyebrow">PERSONAL LEVEL LIBRARY</span><h1 id="heading">Level Dashboard <span class="grad">A0–C2</span></h1><p class="muted" id="description">Choose a topic, filter the curriculum and open each lesson in its dedicated Lesson Studio.</p><div class="stats"><div class="stat"><strong id="total">—</strong><span class="muted">lessons in this view</span></div><div class="stat"><strong>18</strong><span class="muted">lesson modules supported</span></div><div class="stat"><strong>3</strong><span class="muted">view modes & filters</span></div></div></section><div class="filters"><input id="search" placeholder="Search by lesson title or topic…"><select id="category"><option value="all">All categories</option><option value="general">General English</option><option value="business">Business English</option><option value="biblical">Biblical English</option><option value="kids">Kids English</option></select><select id="age"><option value="all">All age bands</option><option value="4-6">Kids 4–6</option><option value="7-9">Kids 7–9</option><option value="10-12">Kids 10–12</option></select><div class="switch"><button class="btn alt" id="cards">▦ Cards</button><button class="btn alt" id="list">☷ List</button></div></div><p class="muted" id="status">Connecting to lesson library…</p><main id="results" class="results"></main></div><script>
const cfg=window.FI_CONFIG||{},params=new URLSearchParams(location.search),requested=params.get('level')||'all',requestedTrack=params.get('track')||'all',valid=['A0','A1','A2','B1','B2','C1','C2'];let rows=[],mode='cards';const $=id=>document.getElementById(id);if(localStorage.getItem('fi-theme')==='light')document.body.classList.add('light');$('theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('fi-theme',document.body.classList.contains('light')?'light':'dark')};if(requestedTrack!=='all'){$('heading').innerHTML='Specialist Dashboard <span class="grad">'+({business:'Business English',biblical:'Biblical English',kids:'Kids English',general:'General English'}[requestedTrack]||'English')+'</span>';$('description').textContent='Explore this specialist collection with topic filters, age-band filters and card/list views.'}
if(valid.includes(requested)){$('heading').innerHTML='Level Dashboard <span class="grad">'+requested+'</span>';$('description').textContent='Explore the '+requested+' curriculum. Filter by theme or track, switch between cards and list, and open any available lesson.'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(['general','business','biblical','kids'].includes(requestedTrack))$('category').value=requestedTrack;
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value,age=$('age').value;const data=rows.filter(x=>(requested==='all'||x.cefr_level===requested)&&(cat==='all'||x.category===cat)&&(age==='all'||x.age_band===age)&&(!q||[x.title,x.topic,x.description,x.cefr_level,x.category,x.age_band].join(' ').toLowerCase().includes(q)));$('total').textContent=data.length;$('status').textContent=data.length+' lessons found';const names={general:'General English',business:'Business English',biblical:'Biblical English',kids:'Kids English'};$('results').classList.toggle('list',mode==='list');$('results').innerHTML=data.length?data.map(x=>{const action=x.is_free?'<a class="btn" href="lesson.html?lesson='+encodeURIComponent(x.slug)+'">Open lesson →</a>':'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/5541998778348?text='+encodeURIComponent('Olá! Tenho interesse no kit '+x.title+' ('+x.cefr_level+').')+'">Request kit ↗</a>';return '<article class="lesson"><div><span class="pill">'+esc(x.cefr_level)+' · '+esc(names[x.category]||x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.topic||x.description||'Lesson')+(x.age_band?' · Ages '+esc(x.age_band):'')+'</p></div><div class="bottom"><small class="muted">'+(x.is_free?'Free sample':'Teacher kit')+'</small>'+action+'</div></article>'}).join(''):'<div class="empty">No lessons match these filters. Change the search or category.</div>'}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('age').addEventListener('change',render);$('cards').onclick=()=>{mode='cards';render()};$('list').onclick=()=>{mode='list';render()};
(async()=>{if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey){$('status').textContent='Supabase configuration is unavailable.';return}try{const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data,error}=await sb.from('curriculum_catalog').select('slug,title,cefr_level,topic,description,category,target_audience,is_free,status,age_band').eq('status','published').order('title');if(error)throw error;rows=data||[];render()}catch(e){$('status').textContent='Could not load the library. Refresh or check public catalog permissions.';console.error(e)}})();
</script></body></html>
